name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project IOSWebAgent.xcodeproj \
            -target IOSWebAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/Debug-iphonesimulator/IOSWebAgent.app IOSWebAgent-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: IOSWebAgent-Simulator
          path: IOSWebAgent-Simulator.zip
          if-no-files-found: error

      - name: Build for physical iPhone SDK
        run: |
          set -o pipefail
          rm -rf build-device
          xcodebuild \
            -project IOSWebAgent.xcodeproj \
            -target IOSWebAgent \
            -configuration Debug \
            -sdk iphoneos \
            SYMROOT="$PWD/build-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
